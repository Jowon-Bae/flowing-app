<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Flowing — 필리핀 아웃리치</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#111;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;}
    ::-webkit-scrollbar{display:none;}
    button{border:none;background:none;cursor:pointer;font-family:inherit;}

    /* ── Loading screen ── */
    @keyframes spin3d {
      0%   { transform: perspective(600px) rotateY(0deg)   rotateX(15deg); }
      25%  { transform: perspective(600px) rotateY(180deg)  rotateX(-10deg); }
      50%  { transform: perspective(600px) rotateY(360deg)  rotateX(15deg); }
      75%  { transform: perspective(600px) rotateY(540deg)  rotateX(-10deg); }
      100% { transform: perspective(600px) rotateY(720deg)  rotateX(15deg); }
    }
    @keyframes loadFadeOut {
      0%   { opacity:1; }
      100% { opacity:0; pointer-events:none; }
    }
    .logo-spin {
      animation: spin3d 2.4s cubic-bezier(.4,.0,.2,1) forwards;
    }
    .loading-exit {
      animation: loadFadeOut .5s ease .1s forwards;
    }

    /* ── General ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .fade-up{animation:fadeUp .4s ease-out both;}
    .s1{animation-delay:.05s;} .s2{animation-delay:.1s;} .s3{animation-delay:.15s;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect}=React;

/* ═══ COLORS ═══ */
const C={
  dark:'#0d1a12',card:'#ffffff',
  accent:'#22c55e',accentDark:'#16a34a',accentMint:'#86efac',accentBg:'#f0fdf4',
  text:'#111827',sub:'#6b7280',border:'#f3f4f6',bg:'#f5f5f5',
};

/* ═══ LOADING SCREEN ═══ */
function LoadingScreen({onDone}){
  const[exiting,setExiting]=useState(false);

  useEffect(()=>{
    // spin3d is 2.4s, then wait a beat, then fade out
    const t1=setTimeout(()=>setExiting(true), 2800);
    const t2=setTimeout(()=>onDone(), 3400);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);

  return(
    <div className={exiting?'loading-exit':''}
      style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      {/* Background image */}
      <img src="images/loading.jpg" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}} alt=""/>
      {/* Dark overlay */}
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.45)'}}/>
      {/* Logo with 3D spin */}
      <div className="logo-spin" style={{position:'relative',zIndex:1,transformStyle:'preserve-3d',backfaceVisibility:'visible'}}>
        <img src="images/load_logo.png" alt="Flowing"
          style={{width:90,height:90,objectFit:'contain',filter:'drop-shadow(0 8px 30px rgba(0,0,0,.5))'}}/>
      </div>
    </div>
  );
}

/* ═══ PHOTO HERO (with real image) ═══ */
function PhotoHero({src,h=280,children,fallbackGrad='linear-gradient(160deg,#0a2415,#2d6a4f)'}){
  return(
    <div style={{position:'relative',height:h,overflow:'hidden',background:fallbackGrad}}>
      {src&&<img src={src} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}} alt=""/>}
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:'70%',background:'linear-gradient(to top,rgba(0,0,0,.75),transparent)'}}/>
      {children}
    </div>
  );
}

/* ═══ HOME ═══ */
function HomeTab({setActiveTab}){
  return(
    <div style={{background:C.bg,minHeight:'100%'}}>
      {/* HERO */}
      <PhotoHero src="images/hero.jpg" h={420}>
        <div style={{position:'absolute',top:52,left:20,display:'flex',alignItems:'center',gap:8}}>
          <img src="images/logo.png" style={{width:28,height:28,borderRadius:6,objectFit:'contain'}} alt=""/>
          <span style={{color:'rgba(255,255,255,.85)',fontSize:11,fontWeight:600,letterSpacing:'.1em'}}>SEOUL DREAM CHURCH</span>
        </div>
        <div style={{position:'absolute',bottom:32,left:20,right:20}}>
          <div style={{color:C.accentMint,fontSize:12,fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:8}}>Philippines Outreach 2025</div>

            사랑이<br/>흘러갑니다

          <div style={{color:'rgba(255,255,255,.65)',fontSize:14,fontWeight:400,lineHeight:1.6}}>

      <div style={{background:'#fff',padding:'20px 20px',display:'flex',borderBottom:`1px solid ${C.border}`}}>

          <div style={{color:C.text,fontWeight:900,fontSize:18}}>최근 소식</div>
          <div style={{color:C.accentDark,fontSize:12,fontWeight:600}}>전체 보기 →</div>

        <div style={{background:'#fff',borderRadius:20,overflow:'hidden',boxShadow:'0 2px 16px rgba(0,0,0,.07)'}}>

            </div>
          </div>
          <div style={{padding:'18px 18px 20px'}}>
            <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:6}}>2025년 7월 3일</div>
            <div style={{color:C.text,fontWeight:800,fontSize:16,lineHeight:1.35,marginBottom:8}}>후원 물품 모금이 시작되었습니다!</div>
            <div style={{color:C.sub,fontSize:13,lineHeight:1.65}}>
              7월 14일 필리핀 마닐라 Tondo 지역 아이들을 위한 아웃리치가 시작됩니다. 200여 명의 아이들에게 사랑을 전할 물품 후원에 동참해 주세요.
            </div>

        </div>
      </div>

      {/* WHERE WE GO */}
      <div style={{padding:'28px 20px 0'}}>
        <div style={{color:C.text,fontWeight:900,fontSize:18,marginBottom:14}}>어디로 가나요?</div>
        <div style={{background:'#fff',borderRadius:20,overflow:'hidden',boxShadow:'0 2px 16px rgba(0,0,0,.07)'}}>
          <div style={{height:140,background:'linear-gradient(135deg,#e8f5e9,#c8e6c9)',position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:32}}>🗺️</div>
              <div style={{color:'#2d6a4f',fontWeight:700,fontSize:13,marginTop:4}}>Manila, Philippines</div>
              <div style={{color:'#52b788',fontSize:11}}>Tondo District</div>
            </div>
          </div>
          <div style={{padding:'16px 18px 20px'}}>
            <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:6}}>필리핀 마닐라 Tondo 지역</div>
            <div style={{color:C.sub,fontSize:13,lineHeight:1.65}}>
              마닐라 북부에 위치한 Tondo는 필리핀에서 가장 인구 밀도가 높은 지역 중 하나입니다. 많은 아이들이 교육과 기본 생필품이 필요한 환경에서 자라고 있습니다.
            </div>
          </div>
        </div>
      </div>

      {/* HOW TO PARTICIPATE */}
      <div style={{padding:'28px 20px 28px'}}>
        <div style={{color:C.text,fontWeight:900,fontSize:18,marginBottom:14}}>어떻게 참여할 수 있나요?</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {[
            {emoji:'📦',title:'물품 후원',desc:'필요한 물품 목록을 보고 직접 후원해요',tab:'support'},
            {emoji:'🙏',title:'기도로 동참',desc:'함께 기도하며 사역을 응원해요',tab:'prayer'},
            {emoji:'📖',title:'아웃리치 소개',desc:'이 사역이 왜 중요한지 알아보아요',tab:'about'},

              <div style={{width:44,height:44,borderRadius:12,background:C.accentBg,border:'1px solid #bbf7d0',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{item.emoji}</div>
              <div style={{flex:1}}>
                <div style={{color:C.text,fontWeight:700,fontSize:14}}>{item.title}</div>
                <div style={{color:C.sub,fontSize:12,marginTop:2}}>{item.desc}</div>
              </div>

  );
}

/* ═══ APP ═══ */
function App(){
  const[loading,setLoading]=useState(true);
  const[tab,setTab]=useState('home');
  return(
    <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:C.bg,position:'relative'}}>
      {loading&&<LoadingScreen onDone={()=>setLoading(false)}/>}
      {!loading&&(
        <>
          <div style={{paddingBottom:80,overflowY:'auto',height:'100vh',WebkitOverflowScrolling:'touch'}}>
            {tab==='home'&&<HomeTab setActiveTab={setTab}/>}
            {tab==='about'&&<AboutTab/>}
            {tab==='support'&&<SupportTab/>}
            {tab==='prayer'&&<PrayerTab/>}
          </div>
          <BottomNav tab={tab} setTab={setTab}/>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
